<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Long Now Garden — attract mode</title>
<meta name="description" content="A continuous attract-mode walk through the lab's paper-cluster visualizations: mycelium, a Kardar–Parisi–Zhang growing front, the loom, the knot index.">
<style>
  :root{--bg:#06070e;--ink:#e8e4d8;--dim:#8a8676;--gold:#d4a84f;--mercury:#8fb8c9}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{font:15px/1.65 Georgia,'Times New Roman',serif;color:var(--ink)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #veil{position:fixed;inset:0;background:var(--bg);opacity:1;transition:opacity 1.1s ease;pointer-events:none;z-index:3}
  #cap{position:fixed;left:38px;bottom:34px;max-width:520px;z-index:4;text-shadow:0 2px 16px #000;transition:opacity 1.2s ease}
  #cap .k{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
  #cap h1{font-size:clamp(22px,3.4vw,36px);font-weight:400;line-height:1.15;margin:6px 0 6px}
  #cap h1 em{color:var(--gold)}
  #cap p{color:var(--dim);font-size:13px;max-width:52ch}
  #hint{position:fixed;right:30px;bottom:26px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;color:#4a473c;text-transform:uppercase;z-index:4;transition:opacity 1.5s}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"></div>
<div id="cap"><div class="k" id="cap-k"></div><h1 id="cap-t"></h1><p id="cap-p"></p></div>
<div id="hint">any key / click — next movement</div>
<script type="module">
import * as THREE from 'three';

/* ================================================================ */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x06070e);
scene.fog=new THREE.FogExp2(0x06070e,0.018);
const cam=new THREE.PerspectiveCamera(50,1,0.1,300);
scene.add(new THREE.AmbientLight(0x2a3050,1.6));
const key=new THREE.DirectionalLight(0xd4a84f,0.9); key.position.set(8,10,4); scene.add(key);
const rim=new THREE.DirectionalLight(0x8fb8c9,0.5); rim.position.set(-8,-2,-8); scene.add(rim);
{ const n=900,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){pos[i*3]=(Math.random()-.5)*80;pos[i*3+1]=(Math.random()-.5)*50;pos[i*3+2]=(Math.random()-.5)*80}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x3a3d4e,size:.06,transparent:true,opacity:.7}))); }

const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NODE_COLORS=[0xd4a84f,0xc0623a,0x8fb8c9,0x9a7fd4,0xcfc9b8];

/* ================= SCENE 1: MYCELIUM ================= */
function makeMycelium(r){
  const g=new THREE.Group();const st={grown:0};
  const segs=[],nodes=[],tips=[];
  const newTip=(pos,dir,gen)=>{const t={p:pos.clone(),d:dir.clone().normalize(),gen,life:50+gen*12+r()*30,alive:true};tips.push(t);return t};
  for(let i=0;i<11;i++){const a=i/11*Math.PI*2;newTip(new THREE.Vector3(Math.cos(a)*.5,-3.2,Math.sin(a)*.5),new THREE.Vector3(Math.cos(a)*.5,.75,Math.sin(a)*.5),0)}
  const pts=[];let guard=0;
  while(tips.some(t=>t.alive)&&guard++<4000){
    for(const t of tips){
      if(!t.alive)continue;
      t.d.x+=(r()-.5)*.34-t.p.x*.006;t.d.y+=(r()-.5)*.28+.02;t.d.z+=(r()-.5)*.34-t.p.z*.006;t.d.normalize();
      const np=t.p.clone().addScaledVector(t.d,.42+r()*.2);
      segs.push([t.p.clone(),np,t.gen]);pts.push(np);t.p=np;
      if(t.gen>0&&r()<.03){let best=null,bd=1.3;
        for(let i=0;i<pts.length-6;i+=3){const dd=pts[i].distanceTo(t.p);if(dd<bd){bd=dd;best=pts[i]}}
        if(best){segs.push([t.p.clone(),best.clone(),t.gen]);nodes.push({p:t.p.clone()});t.alive=false;continue}}
      if(r()<.09&&t.gen<5){const ax=new THREE.Vector3(r()-.5,r()-.5,r()-.5).normalize();
        newTip(t.p,t.d.clone().applyAxisAngle(ax,.5+r()*.9),t.gen+1);t.d.applyAxisAngle(ax,-.4*r())}
      t.life-=1;if(t.life<=0||t.p.length()>13){t.alive=false;nodes.push({p:t.p.clone()})}
    }
  }
  const lv=new Float32Array(segs.length*6),cv=new Float32Array(segs.length*6);
  const cA=new THREE.Color(0xbfa468),cB=new THREE.Color(0x6a6248);
  segs.forEach((s,i)=>{lv.set([s[0].x,s[0].y,s[0].z,s[1].x,s[1].y,s[1].z],i*6);
    const col=cA.clone().lerp(cB,Math.min(1,s[2]/4));cv.set([col.r,col.g,col.b,col.r,col.g,col.b],i*6)});
  const lg=new THREE.BufferGeometry();
  lg.setAttribute('position',new THREE.BufferAttribute(lv,3));
  lg.setAttribute('color',new THREE.BufferAttribute(cv,3));
  lg.setDrawRange(0,0);
  g.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({vertexColors:true})));
  // fruiting bodies
  const anchors=nodes.slice().sort((a,b)=>b.p.length()-a.p.length()).slice(0,26);
  const inst=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.22,1),new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),anchors.length);
  inst.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(anchors.length*3),3);
  anchors.forEach((n,i)=>{inst.setColorAt(i,new THREE.Color(NODE_COLORS[i%5]));
    const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:NODE_COLORS[i%5],transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));
    spr.scale.setScalar(1.2);spr.position.copy(n.p);g.add(spr);n.spr=spr});
  g.add(inst);
  st.update=(dt,t)=>{
    if(st.grown<segs.length){st.grown=Math.min(segs.length,st.grown+dt*Math.max(400,segs.length/5));lg.setDrawRange(0,st.grown|0)}
    const done=st.grown/segs.length,m=new THREE.Matrix4();
    anchors.forEach((n,i)=>{const sc=Math.max(.001,Math.min(1,(done-.5)*3));m.makeScale(sc,sc,sc);m.setPosition(n.p);inst.setMatrixAt(i,m);
      n.spr.material.opacity=.8*sc*(0.8+0.2*Math.sin(t*.002+i))});
    inst.instanceMatrix.needsUpdate=true;
  };
  return{group:g,update:st.update};
}

/* ================= SCENE 2: KPZ FRONT ================= */
/*  dh/dt = nu * lap(h) + (lam/2)(dh/dx)^2 + eta * noise
    front lives on top; its history sinks below as banded strata. */
function makeKPZ(r){
  const g=new THREE.Group();
  const L=220,ROWS=150,DZ=.34,DY=.22;
  let h=new Float64Array(L),hn=new Float64Array(L);
  const nu=.9,lam=1.2,eta=.55,dt=.02;
  // warm start so it's rough immediately
  for(let k=0;k<300;k++)step();
  function step(){
    for(let i=0;i<L;i++){
      const im=(i-1+L)%L,ip=(i+1)%L;
      const lap=h[im]-2*h[i]+h[ip];
      const grad=(h[ip]-h[im])*.5;
      hn[i]=h[i]+dt*(nu*lap+ .5*lam*grad*grad)+eta*Math.sqrt(dt)*(r()*2-1)*2.0;
    }
    [h,hn]=[hn,h];
  }
  // strata: ROWS line-strips, ring buffer; slot 0 = live front
  const rowGeo=[],rowMat=[],slotAge=new Float32Array(ROWS).fill(ROWS);
  for(let j=0;j<ROWS;j++){
    const geo=new THREE.BufferGeometry();
    const pos=new Float32Array(L*3),col=new Float32Array(L*3);
    for(let i=0;i<L;i++){pos[i*3]=(i-L/2)*.11}
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color',new THREE.BufferAttribute(col,3));
    const mat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.95});
    const line=new THREE.Line(geo,mat);g.add(line);
    rowGeo.push(geo);rowMat.push(mat);
  }
  let head=0,acc=0;
  const cLo=new THREE.Color(0x243450),cMid=new THREE.Color(0x4a7194),cHi=new THREE.Color(0xd4a84f);
  function pushRow(){
    // recenter: KPZ grows a mean height we don't need — keep the front framed
    let m=0;for(let i=0;i<L;i++)m+=h[i];m/=L;
    for(let i=0;i<L;i++)h[i]-=m;
    head=(head+ROWS-1)%ROWS;
    const pos=rowGeo[head].attributes.position.array,col=rowGeo[head].attributes.color.array;
    for(let i=0;i<L;i++){
      const ip=(i+1)%L,slope=Math.abs(h[ip]-h[i]);
      pos[i*3+1]=h[i]*.18;
      const c=cLo.clone().lerp(cMid,Math.min(1,slope*1.2)).lerp(cHi,Math.min(1,slope*slope*2.0));
      col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    }
    rowGeo[head].attributes.position.needsUpdate=true;
    rowGeo[head].attributes.color.needsUpdate=true;
    for(let j=0;j<ROWS;j++)slotAge[j]++;
    slotAge[head]=0;
    // reposition: front slot at z=0, older slots deeper
    for(let j=0;j<ROWS;j++){
      const age=slotAge[j],line=g.children[j];
      line.position.z=-age*DZ;line.position.y=-age*DY;
      rowMat[j].opacity=Math.max(.15,1-age*.006)*(1-age/ROWS*.3);
    }
  }
  for(let j=0;j<ROWS;j++)pushRow(); // pre-fill so the cliff exists at fade-in
  const st={};
  st.update=(dt,t)=>{
    acc+=dt;
    // sim substeps — front advances ~4 rows/sec
    const n=Math.max(4,Math.min(14,(dt*300)|0));
    for(let k=0;k<n;k++)step();
    if(acc>.34){acc=0;pushRow()}
  };
  return{group:g,update:st.update};
}

/* ================= SCENE 3: THE LOOM ================= */
function makeLoom(r){
  const g=new THREE.Group();
  const NWARP=24,NWEFT=18,W=22,D=15,PTS=56,WPTS=NWARP*14;
  let phase=r()*10,phaseV=.25+r()*.3;
  const warpGeos=[],weftGeos=[],knots=[];
  const warpX=[],weftZ=[];
  for(let i=0;i<NWARP;i++)warpX.push(-W/2+W*i/(NWARP-1));
  for(let j=0;j<NWEFT;j++)weftZ.push(-D/2+D*j/(NWEFT-1));
  const cWarp=new THREE.Color(0xc8a55e),cWeft=new THREE.Color(0x5f7d8c);
  for(const x of warpX){
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(PTS*3),3));
    const col=new Float32Array(PTS*3);for(let i=0;i<PTS;i++)col.set([cWarp.r,cWarp.g,cWarp.b],i*3);
    geo.setAttribute('color',new THREE.BufferAttribute(col,3));
    g.add(new THREE.Line(geo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.95})));
    warpGeos.push({g:geo,x});
  }
  for(let j=0;j<NWEFT;j++){
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(WPTS*3),3));
    const col=new Float32Array(WPTS*3);for(let i=0;i<WPTS;i++)col.set([cWeft.r,cWeft.g,cWeft.b],i*3);
    geo.setAttribute('color',new THREE.BufferAttribute(col,3));
    g.add(new THREE.Line(geo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.9})));
    weftGeos.push({g:geo,z:weftZ[j],j});
  }
  // knots
  const gap=W/(NWARP-1);
  const inst=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.24,1),new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),14);
  inst.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(14*3),3);
  const used=new Set();
  for(let i=0;i<14;i++){
    let a,b,tries=0;
    do{a=2+((r()*(NWARP-4))|0);b=2+((r()*(NWEFT-4))|0);tries++}while(used.has(a*100+b)&&tries<50);
    used.add(a*100+b);
    const col=NODE_COLORS[i%5];inst.setColorAt(i,new THREE.Color(col));
    const n={a,b,p:new THREE.Vector3()};
    const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:col,transparent:true,opacity:.8,depthWrite:false,blending:THREE.AdditiveBlending}));
    spr.scale.setScalar(1.2);g.add(spr);n.spr=spr;knots.push(n);
  }
  g.add(inst);
  const st={};
  st.update=(dt,t)=>{
    phase+=dt*phaseV;
    warpGeos.forEach(({g:geo,x})=>{const a=geo.attributes.position.array;
      for(let i=0;i<PTS;i++){const z=-D/2-2+(D+4)*i/(PTS-1);
        a[i*3]=x+Math.sin(z*.7+phase+x*.3)*.35;a[i*3+1]=Math.sin(z*.9+phase*1.3+x*.5)*.45;a[i*3+2]=z}
      geo.attributes.position.needsUpdate=true});
    weftGeos.forEach(({g:geo,z,j})=>{const a=geo.attributes.position.array;
      for(let i=0;i<WPTS;i++){const x=-W/2-2+(W+4)*i/(WPTS-1);const u=(x+W/2)/gap;
        a[i*3]=x;a[i*3+1]=Math.sin(Math.PI*(u%1))*1.05*(((Math.floor(u)+j)%2)?1:-1)+Math.sin(x*.5+phase*.8+z*.4)*.3;
        a[i*3+2]=z+Math.sin(x*.6+phase+z*.5)*.3}
      geo.attributes.position.needsUpdate=true});
    const m=new THREE.Matrix4();
    knots.forEach((n,i)=>{
      const x=warpX[n.a],z=weftZ[n.b];
      n.p.set(x+Math.sin(z*.7+phase+x*.3)*.35,1.1*(((n.a+n.b)%2)?1:-1)+Math.sin(x*.5+phase*.8+z*.4)*.3+.35,z+Math.sin(x*.6+phase+z*.5)*.3);
      n.spr.position.copy(n.p);
      m.makeScale(1.15,1.15,1.15);m.setPosition(n.p);inst.setMatrixAt(i,m);
      n.spr.material.opacity=.7*(0.8+0.2*Math.sin(t*.002+i));
    });
    inst.instanceMatrix.needsUpdate=true;
  };
  return{group:g,update:st.update};
}

/* ================= SCENE 4: THE KNOT ================= */
function makeKnot(r){
  const g=new THREE.Group();
  const pq=[[2,3],[2,5],[3,4],[3,5]];
  const [p,q]=pq[(r()*pq.length)|0];
  const N=1400,v=new THREE.Vector3(),pts=[];
  const kp=(t,out)=>{const R=6,rr=2.4;
    return out.set((R+rr*Math.cos(q*t))*Math.cos(p*t),rr*Math.sin(q*t)*1.6,(R+rr*Math.cos(q*t))*Math.sin(p*t))};
  for(let i=0;i<=N;i++)pts.push(kp(i/N*Math.PI*2,new THREE.Vector3()).clone());
  const curve=new THREE.CatmullRomCurve3(pts,true);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,900,.075,6,true),
    new THREE.MeshStandardMaterial({color:0xb08a45,roughness:.35,metalness:.7,emissive:0x33240a,emissiveIntensity:.5})));
  const pts2=[];
  for(let i=0;i<=N;i++){const t=i/N*Math.PI*2;
    pts2.push(new THREE.Vector3((5.2+2.4*Math.cos(q*t+Math.PI))*Math.cos(p*t),2.4*Math.sin(q*t+Math.PI)*1.6,(5.2+2.4*Math.cos(q*t+Math.PI))*Math.sin(p*t)))}
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts2,true),900,.045,5,true),
    new THREE.MeshBasicMaterial({color:0x4d6a78,transparent:true,opacity:.55})));
  const inst=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.26,1),new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),14);
  inst.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(14*3),3);
  const beads=[];
  for(let i=0;i<14;i++){const col=NODE_COLORS[i%5];inst.setColorAt(i,new THREE.Color(col));
    const n={u:(i/14+.03)%1,p:new THREE.Vector3()};
    const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:col,transparent:true,opacity:.8,depthWrite:false,blending:THREE.AdditiveBlending}));
    spr.scale.setScalar(1.2);g.add(spr);n.spr=spr;beads.push(n)}
  g.add(inst);
  const st={spin:0};
  st.update=(dt,t)=>{
    st.spin+=dt*.06;g.rotation.y=st.spin;
    const m=new THREE.Matrix4();
    beads.forEach((n,i)=>{curve.getPointAt(n.u,n.p);n.p.y+=Math.sin(t*.0015+i*2)*.12;
      n.spr.position.copy(n.p);m.makeScale(1.2,1.2,1.2);m.setPosition(n.p);inst.setMatrixAt(i,m);
      n.spr.material.opacity=.7*(0.8+0.2*Math.sin(t*.002+i))});
    inst.instanceMatrix.needsUpdate=true;
  };
  return{group:g,update:st.update};
}

/* ================= MOVEMENT DIRECTOR ================= */
const MOVEMENTS=[
  {id:'01',name:'The Mycelium <em>Map</em>',sub:'living systems — elongation, branching, fusion, stopping; structure from seams, not plans',make:makeMycelium,cam:{pol:1.3,dist:27,ty:3,rate:.05}},
  {id:'02',name:'Kardar–Parisi–<em>Zhang</em>',sub:'a stochastic front roughens as it grows — ν∇²h + (λ/2)(∇h)² + noise; its history sinks into banded strata below',make:makeKPZ,cam:{pol:1.32,dist:34,ty:-9,rate:.03}},
  {id:'03',name:'The <em>Loom</em>',sub:'computation substrates — warp and weft, over and under; the grid is a topological map',make:makeLoom,cam:{pol:1.05,dist:26,ty:0,rate:.04}},
  {id:'04',name:'The Knot <em>Index</em>',sub:'codes, language & topology — a torus knot with a companion thread; invariants you can almost count',make:makeKnot,cam:{pol:1.15,dist:23,ty:0,rate:.05}},
];
const veil=document.getElementById('veil'),cap=document.getElementById('cap');
let cur=-1,live=null,az=.8,pol=1.2,dist=26,ty=0,tAz=.8,tPol=1.2,tDist=26,tTy=0,elapsed=0;
const DUR=42;

function setCap(mv,on){
  cap.style.opacity=on?1:0;
  if(on){document.getElementById('cap-k').textContent='movement '+mv.id+' / 04 — the long now garden';
    document.getElementById('cap-t').innerHTML=mv.name;
    document.getElementById('cap-p').textContent=mv.sub;}
}
function next(){
  veil.style.opacity=1;
  setTimeout(()=>{
    if(live){scene.remove(live.group);live.group.traverse(o=>{o.geometry?.dispose?.()})}
    cur=(cur+1)%MOVEMENTS.length;
    const mv=MOVEMENTS[cur];
    live=mv.make(mulberry32(20261004+cur*7919+Date.now()%977));
    scene.add(live.group);
    tPol=mv.cam.pol;tDist=mv.cam.dist;tTy=mv.cam.ty;
    az=mv.cam.rate>0?az+1.2:az;
    setCap(mv,true);veil.style.opacity=0;
    setTimeout(()=>cap.style.opacity=.35,9000);
    elapsed=0;
  },1150);
}
window.__saver={get cur(){return cur},advances:0,log:[]};
const _next=next;
addEventListener('keydown',()=>{__saver.advances++;__saver.log.push('key@'+elapsed.toFixed(1));_next()});
addEventListener('pointerdown',()=>{__saver.advances++;__saver.log.push('ptr@'+elapsed.toFixed(1));_next()});
setTimeout(()=>document.getElementById('hint').style.opacity=0,14000);

let last=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-last)/1000);last=t;
  elapsed+=dt;if(elapsed>DUR)next();
  if(live)live.update(dt,t*.001);
  // camera drifts toward movement framing
  const k=1-Math.exp(-dt*.5);
  pol+=(tPol-pol)*k;dist+=(tDist-dist)*k;ty+=(tTy-ty)*k;
  az+=dt*MOVEMENTS[Math.max(0,cur)].cam.rate;
  cam.position.set(dist*Math.sin(pol)*Math.sin(az),ty+dist*Math.cos(pol),dist*Math.sin(pol)*Math.cos(az));
  cam.lookAt(0,ty,0);
  renderer.render(scene,cam);
}
function size(){renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
requestAnimationFrame(frame);
</script>
</body>
