<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plasma Weirdness Zoo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    font: 13px/1.45 ui-monospace, Consolas, monospace;
    color: #cfe9ff; background: rgba(4,10,20,.62);
    border: 1px solid rgba(120,190,255,.25); border-radius: 10px;
    padding: 12px 14px; max-width: 380px; backdrop-filter: blur(6px);
    user-select: none;
  }
  #hud h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: .12em; color: #8fd8ff; font-weight: 600; }
  #hud .mode-title { color: #ffd28f; font-size: 13px; margin: 8px 0 2px; }
  #hud .blurb { color: #9fb6cc; font-size: 12px; }
  #hud .btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  #hud button {
    font: 12px ui-monospace, Consolas, monospace; cursor: pointer;
    color: #bfe2ff; background: rgba(30,60,100,.35);
    border: 1px solid rgba(120,190,255,.35); border-radius: 7px; padding: 5px 9px;
  }
  #hud button.active { background: rgba(90,170,255,.35); color: #fff; }
  #hud .keys { margin-top: 8px; color: #5f7f99; font-size: 11px; }
  #stats { position: fixed; bottom: 10px; right: 12px; z-index: 10;
    font: 11px ui-monospace, monospace; color: #4a6a86; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>PLASMA WEIRDNESS ZOO</h1>
  <div class="mode-title" id="modeTitle"></div>
  <div class="blurb" id="modeBlurb"></div>
  <div class="btns" id="modeBtns"></div>
  <div class="keys">drag orbit &middot; wheel zoom &middot; keys 1-3 switch &middot; space auto-orbit</div>
</div>
<div id="stats"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
