<!doctype html><meta charset=utf-8><title>moc smoke harness</title>
<!--
  Real-browser smoke harness for index.html (README "Smoke check").
  Loads the real index.html in an iframe and drives it. Run headless:

    msedge --headless=new --allow-file-access-from-files ^
      --user-data-dir=<tmp> --virtual-time-budget=20000 ^
      --window-size=1200,8000 --dump-dom "file:///.../smoke.html"

  --allow-file-access-from-files is required for file:// iframe DOM
  access. Results land in <pre id=out>. confirm() is stubbed to true so
  the X-reset path can be exercised headlessly.
-->
<pre id=out>RUNNING</pre>
<iframe id=f src="index.html" style="width:1100px;height:700px"></iframe>
<script>
const out = [], R = document.getElementById('out');
const ok = (n, c, d) => out.push((c ? 'PASS' : 'FAIL') + ' ' + n + (d ? ' :: ' + d : ''));
const f = document.getElementById('f');
let phase = 0;
f.addEventListener('load', () => { phase ? afterReload() : run1(); });
const flush = extra => { R.textContent = out.join('\n') + (extra || ''); };

function run1() {
  const w = f.contentWindow, d = w.document;
  try {
    w.confirm = () => true;
    let cap = null;
    const orig = w.URL.createObjectURL.bind(w.URL);
    w.URL.createObjectURL = b => { cap = b; return orig(b); };

    // 1. audit table + dissent + vignette
    const rows = d.querySelectorAll('#audit tr').length - 1;
    ok('audit table has 6 rows', rows === 6, 'rows=' + rows);
    ok('curator dissent present', (d.getElementById('dissent').textContent || '').length > 100);
    ok('vignette present', (d.getElementById('vignette').textContent || '').length > 50);

    // 2. frame 1: image, four layers, badge, radio mark
    const ex0 = d.getElementById('ex0');
    const img = ex0.querySelector('img');
    ok('frame1 image element', !!img, img ? img.getAttribute('src') : '');
    ok('frame1 image decoded', !!(img && img.complete && img.naturalWidth > 0),
       img ? 'nw=' + img.naturalWidth : '');
    ok('frame1 four layer sections', ex0.querySelectorAll('details.layer').length === 4);
    ok('completeness badge shown', /TRUNCATED|UNVERIFIED|COMPLETENESS/.test(ex0.textContent));
    const r = ex0.querySelector('input[data-k="0:claim"][value=visible]');
    r.checked = true; r.dispatchEvent(new w.Event('change', {bubbles: true}));
    ok('layer mark saved to localStorage',
       (w.localStorage.getItem('moc-session-v1') || '').includes('"0:claim":"visible"'));
    const ta = ex0.querySelector('textarea[data-note="0"]');
    ta.value = 'smoke note'; ta.dispatchEvent(new w.Event('input', {bubbles: true}));

    // 3. contested wall: pick placard A on pair 0
    const v = d.querySelector('input[data-v="0"][value="a"]');
    v.checked = true; v.dispatchEvent(new w.Event('change', {bubbles: true}));
    ok('placard A highlights (.sel)', d.getElementById('pa0').classList.contains('sel'));
    ok('vote saved to localStorage',
       (w.localStorage.getItem('moc-session-v1') || '').includes('"0":"a"'));

    // 4. E exports JSON (blob captured, not actually downloaded)
    d.dispatchEvent(new w.KeyboardEvent('keydown', {key: 'e', bubbles: true}));
    ok('export produced a blob', !!cap);
    (cap ? cap.text() : Promise.resolve('')).then(t => {
      let j = null; try { j = JSON.parse(t); } catch (e) {}
      ok('export JSON has layer_marks + contested_wall',
         !!(j && j.layer_marks && j.contested_wall),
         j ? 'layer_marks=' + j.layer_marks.length + ' wall=' + j.contested_wall.length : 'no json');
      ok('export carries the mark', !!(j && j.layer_marks[0].marks.claim === 'visible'));
      // 5. persistence: reload the iframe, then check + reset
      phase = 1; flush('\n(reloading)'); w.location.reload();
    });
  } catch (e) { ok('run1 exception', false, String(e)); flush('\nDONE'); }
}

function afterReload() {
  const w = f.contentWindow, d = w.document;
  try {
    const r = d.querySelector('input[data-k="0:claim"][value=visible]');
    ok('mark persists across reload', !!(r && r.checked));
    const v = d.querySelector('input[data-v="0"][value="a"]');
    ok('vote persists across reload', !!(v && v.checked));
    const ta = d.querySelector('textarea[data-note="0"]');
    ok('note persists across reload', !!(ta && ta.value === 'smoke note'));
    const p = d.getElementById('pa0');
    ok('placard A still highlighted', !!(p && p.classList.contains('sel')));

    w.confirm = () => true;
    d.dispatchEvent(new w.KeyboardEvent('keydown', {key: 'x', bubbles: true}));
    ok('X wipes localStorage', !w.localStorage.getItem('moc-session-v1'));
    ok('X clears radios', !d.querySelector('input[data-k="0:claim"][value=visible]').checked);
    ok('X clears .sel', !d.querySelector('.plabel.sel'));

    let threw = false;
    try { d.dispatchEvent(new w.KeyboardEvent('keydown', {key: 'ArrowRight', bubbles: true})); }
    catch (e) { threw = true; }
    ok('arrow-key nav runs', !threw);
  } catch (e) { ok('afterReload exception', false, String(e)); }
  flush('\nDONE');
}
</script>
