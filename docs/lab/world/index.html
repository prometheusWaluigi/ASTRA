<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lobby — Museum of Everything the Lab Has Made</title>
<style>
:root {
  --ink: #0d0b08;
  --paper: #14110c;
  --gold: #c9a227;
  --gold-bright: #f0d060;
  --gold-dim: #6b5620;
  --bone: #e8dcc0;
  --bone-dim: #a89a78;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--ink); color: var(--bone);
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  height: 100%; overflow: hidden; }
#view { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
#plaque {
  position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%);
  background: rgba(20,17,12,.92); border: 1px solid var(--gold);
  padding: .55rem 1.1rem; text-align: center; pointer-events: none;
  opacity: 0; transition: opacity .18s; max-width: 70vw;
}
#plaque.on { opacity: 1; }
#plaque .t { color: var(--gold-bright); font-size: 1.05rem; letter-spacing: .04em; }
#plaque .b { color: var(--bone-dim); font-size: .8rem; margin-top: .15rem; }
#plaque .k { color: var(--gold); font-size: .75rem; margin-top: .3rem; letter-spacing: .12em; }
#hud {
  position: fixed; left: 12px; bottom: 10px; font-size: .72rem; color: var(--bone-dim);
  letter-spacing: .08em; pointer-events: none;
}
#hud b { color: var(--gold); }
#title {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(13,11,8,.88); z-index: 5; transition: opacity .4s; text-align: center;
}
#title.off { opacity: 0; pointer-events: none; }
#title h1 { color: var(--gold-bright); font-weight: normal; letter-spacing: .12em;
  font-size: clamp(1.4rem, 4vw, 2.4rem); margin: 0 0 .6rem; }
#title p { color: var(--bone-dim); margin: .25rem 0; font-size: .95rem; }
#title .rule { width: 220px; height: 1px; margin: 1rem auto;
  background: linear-gradient(90deg, transparent, var(--gold), transparent); }
#frame-wrap {
  position: fixed; inset: 4vh 4vw; z-index: 10; display: none;
  border: 1px solid var(--gold); background: var(--ink);
  box-shadow: 0 0 60px rgba(201,162,39,.25);
}
#frame-wrap.on { display: block; }
#frame-wrap iframe { width: 100%; height: 100%; border: 0; background: var(--ink); }
#frame-bar { position: absolute; top: -1.9rem; right: 0; font-size: .75rem; color: var(--bone-dim); }
#frame-bar b { color: var(--gold); cursor: pointer; }
#minimap { position: fixed; right: 12px; top: 12px; opacity: .8; border: 1px solid var(--gold-dim); }
#veil { position: fixed; inset: 0; background: var(--ink); opacity: 0;
  transition: opacity .3s; pointer-events: none; z-index: 8; }
#hallname { position: fixed; top: 12vh; left: 0; right: 0; text-align: center;
  color: var(--gold-bright); letter-spacing: .35em; font-size: 1.05rem;
  text-transform: uppercase; opacity: 0; transition: opacity .6s;
  pointer-events: none; z-index: 9; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<canvas id="minimap" width="200" height="140"></canvas>
<div id="plaque"><div class="t"></div><div class="b"></div><div class="k">E — ENTER</div></div>
<div id="hud"><b>WASD</b> move &nbsp; <b>mouse / &larr;&rarr;</b> turn &nbsp; <b>E</b> enter exhibit &nbsp; <b>X</b> close</div>
<div id="title"><div>
  <h1>THE LOBBY</h1>
  <div class="rule"></div>
  <p>a museum of everything the lab has made</p>
  <p>v1.0 — the breakroom is hung: the board overhears itself, south pedestal under the dome</p>
  <p style="margin-top:1.2rem;color:var(--gold)">click, or press any key</p>
</div></div>
<div id="frame-wrap"><div id="frame-bar"><b>X — back to the hall</b></div><iframe id="frame"></iframe></div>
<div id="veil"></div>
<div id="hallname"></div>

<script src="exhibits.js"></script>
<script>
"use strict";
const MAPS = [
// 0 — the lobby. '=' is a door: a wall to the eye, a seam to the feet.
["####A####B####C#####",
 "#..................#",
 "#..................#",
 "=..................=",
 "#..................#",
 "#..................#",
 "D........##........E",
 "#........##........#",
 "#..................#",
 "#..................#",
 "#..................#",
 "#..................#",
 "#..................#",
 "########F###########"],
// 1 — the chorus wing, east through the gold door
["#####G###H#####",
 "#.............#",
 "#.............#",
 "=.............K",
 "#.............L",
 "#.............#",
 "#.............#",
 "#.............#",
 "#.............#",
 "#####I###J#####"],
// 2 — the observatory, west through the gold door (instruments & probes)
["#####M###N#####",
 "#.............#",
 "#.............#",
 "Q.............=",
 "R.............#",
 "#.............#",
 "#.............#",
 "#.............#",
 "#.............#",
 "#####O###P#####"],
];
const HALLN = ["the lobby", "the chorus wing", "the observatory"];
let cur = 0; // current hall index
const MW = () => MAPS[cur][0].length, MH = () => MAPS[cur].length;
const cell = (x, y) => (x < 0 || y < 0 || x >= MW() || y >= MH()) ? "#" : MAPS[cur][y | 0][x | 0];
const isWall = c => c !== ".";
const EX = {}; for (const e of (window.EXHIBITS || [])) EX[e.key] = e;
const PED = (window.PEDESTALS || []); // free-standing exhibits: {x, y, title, by, src, blurb, hall?}
for (const p of PED) p.hall = p.hall || 0;
const DOORS = window.DOORS || []; // {hall, x, y, name, to:{hall, x, y, a}} — x,y is the '=' cell

const cv = document.getElementById("view"), cx = cv.getContext("2d");
const mm = document.getElementById("minimap"), mx = mm.getContext("2d");
const plaque = document.getElementById("plaque");
const pT = plaque.querySelector(".t"), pB = plaque.querySelector(".b"),
      pK = plaque.querySelector(".k");
const fw = document.getElementById("frame-wrap"), fr = document.getElementById("frame");

let W = 0, H = 0;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener("resize", resize); resize();

const P = { x: 10.5, y: 10.5, a: -Math.PI / 2 }; // facing north wall
const FOV = Math.PI / 3, COLW = 2, MAXD = 14;
// observatory dome — normalized star field (x, y-fraction of upper half, size, phase)
const STARS = (() => {
  const r = srand(4242), s = [];
  for (let i = 0; i < 110; i++) s.push({ x: r(), y: r(), s: 1 + r() * 1.6, p: r() * 6.28 });
  return s;
})();

// ---- procedural kintsugi textures (seeded, deterministic) ----
function srand(seed) { let s = seed; return () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff; }
function wallTex(seed) {
  const t = document.createElement("canvas"); t.width = t.height = 64;
  const g = t.getContext("2d"), r = srand(seed);
  g.fillStyle = "#191410"; g.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 130; i++) {
    g.fillStyle = `rgba(${30 + r() * 30},${24 + r() * 22},${16 + r() * 14},.5)`;
    g.fillRect(r() * 64, r() * 64, 1 + r() * 2, 1 + r() * 2);
  }
  // gold veins — repaired cracks
  g.strokeStyle = "rgba(201,162,39,.85)"; g.lineWidth = 1;
  for (let v = 0; v < 3; v++) {
    g.beginPath();
    let x = r() * 64, y = 0;
    g.moveTo(x, y);
    while (y < 64) { y += 4 + r() * 8; x += (r() - .5) * 16; g.lineTo(x, y); }
    g.stroke();
  }
  g.fillStyle = "rgba(240,208,96,.6)"; g.fillRect(0, 62, 64, 2); // skirting seam
  return t;
}
function exhibitTex(ex, seed) {
  const t = document.createElement("canvas"); t.width = t.height = 64;
  const g = t.getContext("2d"), r = srand(seed);
  g.drawImage(wallTex(seed), 0, 0);
  g.fillStyle = "#0d0b08"; g.fillRect(6, 6, 52, 52);
  g.strokeStyle = "#c9a227"; g.lineWidth = 2; g.strokeRect(6, 6, 52, 52);
  g.strokeStyle = "rgba(240,208,96,.55)"; g.lineWidth = 1; g.strokeRect(9, 9, 46, 46);
  g.fillStyle = "#f0d060"; g.font = "28px Georgia, serif"; g.textAlign = "center";
  g.textBaseline = "middle"; g.fillText(ex.title[0].toUpperCase(), 32, 34);
  g.fillStyle = "rgba(240,208,96,.9)";
  for (let i = 0; i < 3; i++) g.fillRect(26 + i * 5, 54, 3, 1); // candle-dot rail
  return t;
}
// pedestal sprite — a plinth, a vitrine, a small glowing relic (glyph = title[0])
function pedestalTex(p, seed) {
  const t = document.createElement("canvas"); t.width = 64; t.height = 96;
  const g = t.getContext("2d"), r = srand(seed);
  // plinth — dark stone, gold seams where it was repaired
  g.fillStyle = "#191410"; g.fillRect(14, 52, 36, 44);
  g.fillStyle = "#221b13"; g.fillRect(14, 52, 36, 6);
  g.strokeStyle = "rgba(201,162,39,.7)"; g.lineWidth = 1;
  g.strokeRect(14.5, 52.5, 35, 43);
  g.beginPath(); let x = 20 + r() * 24, y = 58;
  g.moveTo(x, y);
  while (y < 94) { y += 5 + r() * 7; x += (r() - .5) * 10; g.lineTo(x, y); }
  g.stroke();
  // vitrine — a dome of thin gold light
  g.strokeStyle = "rgba(240,208,96,.8)"; g.lineWidth = 1.5;
  g.beginPath(); g.arc(32, 50, 20, Math.PI, 0); g.stroke();
  g.fillStyle = "rgba(240,208,96,.08)";
  g.beginPath(); g.arc(32, 50, 20, Math.PI, 0); g.closePath(); g.fill();
  // the relic — floating glyph
  g.fillStyle = "#f0d060"; g.font = "22px Georgia, serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(p.title[0].toUpperCase(), 32, 40);
  g.fillStyle = "rgba(240,208,96,.5)";
  g.beginPath(); g.ellipse(32, 50, 8, 2.5, 0, 0, Math.PI * 2); g.fill();
  return t;
}
// door texture — a dark portal with a gold architrave, light through the seam
function doorTex(seed) {
  const t = document.createElement("canvas"); t.width = t.height = 64;
  const g = t.getContext("2d");
  g.drawImage(wallTex(seed), 0, 0);
  g.fillStyle = "#070503"; g.fillRect(18, 4, 28, 60);
  g.strokeStyle = "#c9a227"; g.lineWidth = 2; g.strokeRect(17, 3, 30, 61);
  g.strokeStyle = "rgba(240,208,96,.45)"; g.lineWidth = 1; g.strokeRect(20.5, 6.5, 23, 57);
  g.fillStyle = "rgba(240,208,96,.3)"; g.fillRect(30, 8, 3, 54);   // light through the seam
  g.fillStyle = "rgba(240,208,96,.09)"; g.fillRect(24, 8, 16, 54); // spill
  g.fillStyle = "rgba(240,208,96,.5)"; g.fillRect(20, 63, 24, 1);  // threshold
  return t;
}
const TEX = { "#": wallTex(7), "=": doorTex(53) };
for (const e of (window.EXHIBITS || [])) TEX[e.key] = exhibitTex(e, 100 + e.key.charCodeAt(0));
for (const p of PED) p.tex = pedestalTex(p, 31 + p.title.charCodeAt(0) * 7);

function cast(ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let mx0 = P.x | 0, my0 = P.y | 0;
  const ddx = Math.abs(1 / (dx || 1e-9)), ddy = Math.abs(1 / (dy || 1e-9));
  let sx, sy, sdx, sdy;
  if (dx < 0) { sx = -1; sdx = (P.x - mx0) * ddx; } else { sx = 1; sdx = (mx0 + 1 - P.x) * ddx; }
  if (dy < 0) { sy = -1; sdy = (P.y - my0) * ddy; } else { sy = 1; sdy = (my0 + 1 - P.y) * ddy; }
  let side = 0, c = ".", d = 0;
  for (let i = 0; i < 64; i++) {
    if (sdx < sdy) { mx0 += sx; d = sdx; sdx += ddx; side = 0; }
    else { my0 += sy; d = sdy; sdy += ddy; side = 1; }
    c = cell(mx0, my0);
    if (isWall(c)) break;
  }
  const wx = side === 0 ? P.y + d * dy : P.x + d * dx;
  return { d, c, side, tx: wx - Math.floor(wx) };
}

let zbuf = [];
function render() {
  const cols = Math.ceil(W / COLW);
  zbuf.length = cols;
  // ceiling + floor
  const grd = cx.createLinearGradient(0, 0, 0, H / 2);
  grd.addColorStop(0, "#050403"); grd.addColorStop(1, "#14110c");
  cx.fillStyle = grd; cx.fillRect(0, 0, W, H / 2);
  const grd2 = cx.createLinearGradient(0, H / 2, 0, H);
  grd2.addColorStop(0, "#1c1812"); grd2.addColorStop(1, "#0d0b08");
  cx.fillStyle = grd2; cx.fillRect(0, H / 2, W, H);
  // the observatory keeps its own sky — a fixed night, seeded stars
  if (cur === 2) {
    const t = performance.now() / 1000;
    for (const st of STARS) {
      cx.fillStyle = `rgba(240,208,96,${0.08 + 0.2 * Math.abs(Math.sin(t * 0.6 + st.p))})`;
      cx.fillRect(st.x * W, st.y * H * 0.48, st.s, st.s);
    }
  }
  // gold floor inlay — a cracked ring at the hall's heart
  cx.save();
  cx.translate(W / 2, H * 0.86); cx.scale(1, 0.32);
  cx.strokeStyle = "rgba(201,162,39,.35)"; cx.lineWidth = 6;
  cx.beginPath(); cx.arc(0, 0, 130, 0, Math.PI * 2); cx.stroke();
  cx.strokeStyle = "rgba(240,208,96,.18)"; cx.lineWidth = 14;
  cx.beginPath(); cx.arc(0, 0, 130, 0.4, 1.9); cx.stroke();
  cx.restore();
  for (let i = 0; i < cols; i++) {
    const ang = P.a - FOV / 2 + (i / cols) * FOV;
    const hit = cast(ang), d = hit.d * Math.cos(ang - P.a);
    zbuf[i] = d;
    const h = Math.min(H * 2, H / Math.max(d, 0.05));
    const y0 = (H - h) / 2;
    const tex = TEX[hit.c] || TEX["#"];
    const txc = Math.min(63, Math.max(0, (hit.tx * 64) | 0));
    cx.drawImage(tex, txc, 0, 1, 64, i * COLW, y0, COLW, h);
    let shade = Math.min(0.75, d / 13);
    if (hit.side === 1) shade = Math.min(0.82, shade + 0.12);
    if (EX[hit.c]) shade *= 0.55; // exhibits stay lit like gallery pieces
    cx.fillStyle = `rgba(0,0,0,${shade})`;
    cx.fillRect(i * COLW, y0, COLW, h);
    // exhibit frames get a faint halo
    if (EX[hit.c]) {
      cx.fillStyle = `rgba(240,208,96,${Math.max(0, 0.22 - d * 0.025)})`;
      cx.fillRect(i * COLW, y0, COLW, h);
    }
  }
  // pedestals — billboard sprites, occluded by the wall z-buffer
  for (const p of PED) {
    if (p.hall !== cur) continue;
    const dx = p.x - P.x, dy = p.y - P.y, dist = Math.hypot(dx, dy);
    if (dist < 0.35 || dist > MAXD) continue;
    let ang = Math.atan2(dy, dx) - P.a;
    while (ang > Math.PI) ang -= 2 * Math.PI;
    while (ang < -Math.PI) ang += 2 * Math.PI;
    if (Math.abs(ang) > FOV / 2 + 0.25) continue;
    const sh = (H / dist) * 0.72;                       // ~3/4 wall height
    const sw = sh * (64 / 96);
    const sx = (0.5 + ang / FOV) * W - sw / 2;
    const yTop = (H + H / dist) / 2 - sh;               // feet on the floor
    const c0 = Math.max(0, Math.floor(sx / COLW));
    const c1 = Math.min(cols - 1, Math.ceil((sx + sw) / COLW));
    for (let i = c0; i <= c1; i++) {
      if (dist >= zbuf[i]) continue;
      const txc = Math.min(63, Math.max(0, ((i * COLW - sx) / sw * 64) | 0));
      cx.drawImage(p.tex, txc, 0, 1, 96, i * COLW, yTop, COLW, sh);
      const shade = Math.min(0.6, dist / 16);
      cx.fillStyle = `rgba(0,0,0,${shade})`;
      cx.fillRect(i * COLW, yTop, COLW, sh);
      cx.fillStyle = `rgba(240,208,96,${Math.max(0, 0.16 - dist * 0.02)})`;
      cx.fillRect(i * COLW, yTop, COLW, sh);
    }
  }
  drawMap();
}

function drawMap() {
  const s = 9, mw = MW(), mh = MH();
  mx.clearRect(0, 0, 200, 140);
  mx.fillStyle = "rgba(13,11,8,.9)"; mx.fillRect(0, 0, mw * s + 4, mh * s + 20);
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
    const c = MAPS[cur][y][x];
    if (c === ".") continue;
    mx.fillStyle = c === "=" ? "#f0d060" : EX[c] ? "#c9a227" : "#3a3226";
    mx.fillRect(2 + x * s, 2 + y * s, s - 1, s - 1);
  }
  for (const p of PED) {
    if (p.hall !== cur) continue;
    mx.fillStyle = "#f0d060";
    mx.fillRect(2 + p.x * s - 2, 2 + p.y * s - 2, 4, 4);
  }
  mx.fillStyle = "#f0d060";
  mx.beginPath(); mx.arc(2 + P.x * s, 2 + P.y * s, 3, 0, Math.PI * 2); mx.fill();
  mx.strokeStyle = "#f0d060"; mx.beginPath();
  mx.moveTo(2 + P.x * s, 2 + P.y * s);
  mx.lineTo(2 + (P.x + Math.cos(P.a) * 1.4) * s, 2 + (P.y + Math.sin(P.a) * 1.4) * s);
  mx.stroke();
  mx.fillStyle = "rgba(232,220,192,.7)"; mx.font = "9px Georgia, serif";
  mx.fillText(HALLN[cur] || ("hall " + cur), 4, mh * s + 14);
}

// ---- interaction ----
const keys = {};
addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  document.getElementById("title").classList.add("off");
  if (e.key.toLowerCase() === "x" || e.key === "Escape") closeFrame();
  if (e.key.toLowerCase() === "e" && near && !fw.classList.contains("on")) openFrame(near);
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
cv.addEventListener("click", () => {
  document.getElementById("title").classList.add("off");
  cv.requestPointerLock && cv.requestPointerLock();
});
addEventListener("mousemove", e => {
  if (document.pointerLockElement === cv) P.a += e.movementX * 0.0022;
});

function facingWall() {
  for (let d = 0.4; d < 2.4; d += 0.15) {
    const fx = P.x + Math.cos(P.a) * d, fy = P.y + Math.sin(P.a) * d;
    const c = cell(fx, fy);
    if (!isWall(c)) continue;
    const door = c === "="
      ? DOORS.find(r => r.hall === cur && r.x === (fx | 0) && r.y === (fy | 0)) || null
      : null;
    return { ex: EX[c] || null, door, d };
  }
  return null;
}
function facingPedestal() {
  let best = null, bd = 1.9;
  for (const p of PED) {
    if (p.hall !== cur) continue;
    const dx = p.x - P.x, dy = p.y - P.y, d = Math.hypot(dx, dy);
    if (d > bd) continue;
    let ang = Math.atan2(dy, dx) - P.a;
    while (ang > Math.PI) ang -= 2 * Math.PI;
    while (ang < -Math.PI) ang += 2 * Math.PI;
    if (Math.abs(ang) < 0.55) { best = p; bd = d; }
  }
  return best ? { ex: best, d: bd } : null;
}
function freeAt(x, y) {
  if (isWall(cell(x, y))) return false;
  for (const p of PED) {
    if (p.hall !== cur) continue;
    const dx = p.x - x, dy = p.y - y;
    if (dx * dx + dy * dy < 0.2) return false;
  }
  return true;
}

// doors — walk up to a gold seam and you are through it
const veilEl = document.getElementById("veil"), hnEl = document.getElementById("hallname");
let doorCool = 0;
function teleport(dr, now) {
  doorCool = now + 900;
  veilEl.style.opacity = 1;
  setTimeout(() => {
    cur = dr.to.hall; P.x = dr.to.x; P.y = dr.to.y; P.a = dr.to.a;
    hnEl.textContent = HALLN[cur] || dr.name; hnEl.style.opacity = 1;
    veilEl.style.opacity = 0;
    setTimeout(() => hnEl.style.opacity = 0, 1500);
  }, 300);
}
function checkDoors(now) {
  if (now < doorCool) return;
  for (const dr of DOORS) {
    if (dr.hall !== cur) continue;
    const dx = dr.x + 0.5 - P.x, dy = dr.y + 0.5 - P.y;
    if (Math.hypot(dx, dy) > 1.05) continue;
    let ang = Math.atan2(dy, dx) - P.a;
    while (ang > Math.PI) ang -= 2 * Math.PI;
    while (ang < -Math.PI) ang += 2 * Math.PI;
    if (Math.abs(ang) > 0.9) continue;
    teleport(dr, now);
    return;
  }
}
let near = null;
function openFrame(ex) {
  fr.src = ex.src;
  fw.classList.add("on");
  document.exitPointerLock && document.exitPointerLock();
}
function closeFrame() { fw.classList.remove("on"); fr.src = "about:blank"; }
fw.querySelector("b").addEventListener("click", closeFrame);

// smoke/debug hooks: #play skips the title card, #at=x,y,a teleports, #h=N picks the hall
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.has("play") || location.hash === "#play") {
  const t = document.getElementById("title");
  t.style.transition = "none"; t.classList.add("off");
}
if (hp.has("h")) {
  const h = +hp.get("h");
  if (Number.isInteger(h) && MAPS[h]) cur = h;
}
if (hp.has("at")) {
  const v = hp.get("at").split(",").map(Number);
  if (v.length === 3 && v.every(Number.isFinite)) { P.x = v[0]; P.y = v[1]; P.a = v[2]; }
}
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!fw.classList.contains("on")) {
    const sp = 3.2 * dt, rs = 2.4 * dt;
    if (keys["arrowleft"]) P.a -= rs;
    if (keys["arrowright"]) P.a += rs;
    let mxv = 0, myv = 0;
    if (keys["w"] || keys["arrowup"]) { mxv += Math.cos(P.a) * sp; myv += Math.sin(P.a) * sp; }
    if (keys["s"] || keys["arrowdown"]) { mxv -= Math.cos(P.a) * sp; myv -= Math.sin(P.a) * sp; }
    if (keys["a"]) { mxv += Math.cos(P.a - Math.PI / 2) * sp; myv += Math.sin(P.a - Math.PI / 2) * sp; }
    if (keys["d"]) { mxv += Math.cos(P.a + Math.PI / 2) * sp; myv += Math.sin(P.a + Math.PI / 2) * sp; }
    if (freeAt(P.x + mxv * 3, P.y)) P.x += mxv;
    if (freeAt(P.x, P.y + myv * 3)) P.y += myv;
  }
  const w = facingWall(), pd = facingPedestal();
  near = (pd && (!w || pd.d <= w.d)) ? pd.ex : (w ? w.ex : null);
  checkDoors(now);
  if (near && !fw.classList.contains("on")) {
    pT.textContent = near.title;
    pB.textContent = near.by + " — " + near.blurb;
    pK.textContent = "E — ENTER";
    plaque.classList.add("on");
  } else if (w && w.door && !fw.classList.contains("on")) {
    pT.textContent = "→ " + w.door.name;
    pB.textContent = "a gold seam in the wall";
    pK.textContent = "STEP CLOSER";
    plaque.classList.add("on");
  } else plaque.classList.remove("on");
  render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
