<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poetry Moon Rally</title><style>body{margin:0;background:#110e29;color:#fff4cc;font:18px system-ui;text-align:center}h1{margin:18px 0 6px}p{margin:8px}canvas{width:min(100%,960px);background:#151334;border-radius:16px;touch-action:none}button,a{background:#ffe098;color:#271333;padding:12px 20px;border:0;border-radius:12px;margin:6px;font:inherit;display:inline-block}footer{font-size:13px;padding:18px}audio{width:min(90%,500px)}</style><h1>Poetry Moon Rally</h1><p>Torque collects moon words. Jump the craters; write a tiny poem.</p><canvas id="c" width="960" height="480" aria-label="Monster truck moon rally"></canvas><p id="status" aria-live="polite"></p><button id="jump">Jump · Space / ↑</button><button id="reset">Start again · R</button><p id="poem"></p><audio controls loop src="moon-rally.wav"></audio><p><a href="torque-poetry-moon.mp4">ACE-Step song video</a> <a href="moon-rally.mp4">Watch the moon-rally music video</a></p><footer>Original artistic game + procedural instrumental. No physical simulation claims. Works offline; sound starts only when you press play.</footer><script>
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),poem=document.querySelector('#poem');
const words=['silver','tires','carry','small','dreams','over','the','moon'];let state;const course=[520,950,1400,1820,2240,2650,3080,3470];
function reset(){state={x:0,y:0,vy:0,words:[],missed:0,ended:false};poem.textContent='';}reset();
function jump(){if(!state.ended&&state.y===0)state.vy=400;}
document.querySelector('#jump').onclick=jump;document.querySelector('#reset').onclick=reset;window.addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();jump();}if(e.code==='KeyR')reset();});canvas.addEventListener('pointerdown',jump);
function step(dt){if(state.ended)return;const old=state.x;state.x+=190*dt;state.y=Math.max(0,state.y+state.vy*dt);state.vy-=850*dt;if(state.y===0)state.vy=0;course.forEach((p,i)=>{if(old<p&&state.x>=p){if(state.y>22)state.words.push(words[i]);else state.missed++;}});if(state.x>3800){state.ended=true;poem.textContent=state.words.length?'Your moon poem: '+state.words.join(' ')+' ✦':'Even an empty moon has room for another try.';}}
function draw(){ctx.fillStyle='#151334';ctx.fillRect(0,0,960,480);for(let i=0;i<65;i++){ctx.fillStyle=i%3?'#fff3c5':'#b2a5ff';ctx.fillRect((i*137-state.x*.1+9600)%960,(i*53)%260,2,2);}ctx.fillStyle='#ffe098';ctx.beginPath();ctx.arc(795,95,52,0,7);ctx.fill();ctx.fillStyle='#59496f';ctx.fillRect(0,367,960,113);course.forEach((p,i)=>{const x=230+p-state.x;ctx.fillStyle='#21172f';ctx.beginPath();ctx.ellipse(x,371,42,12,0,0,7);ctx.fill();if(p>state.x){ctx.fillStyle='#ffe098';ctx.font='23px Georgia';ctx.fillText(words[i],x-25,295);}});const y=340-state.y;ctx.fillStyle='#62e6ce';ctx.fillRect(175,y-47,115,38);ctx.fillRect(205,y-75,53,30);ctx.fillStyle='#212241';ctx.fillRect(213,y-69,34,22);[197,274].forEach(x=>{ctx.fillStyle='#171523';ctx.beginPath();ctx.arc(x,y,26,0,7);ctx.fill();ctx.strokeStyle='#ffda7d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,15,0,7);ctx.stroke();const angle=state.x/26;ctx.beginPath();ctx.moveTo(x-14*Math.cos(angle),y-14*Math.sin(angle));ctx.lineTo(x+14*Math.cos(angle),y+14*Math.sin(angle));ctx.stroke();});status.textContent=state.ended?'Finish! '+state.words.length+'/8 moon words. Try again to change your poem.':'Moon words: '+state.words.length+'/8 · Craters crossed: '+(state.words.length+state.missed)+'/8';}
let last=performance.now();function frame(t){step(Math.min(.04,(t-last)/1000));last=t;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);window.rally={reset,jump,step,getState:()=>JSON.parse(JSON.stringify(state))};
</script></html>
