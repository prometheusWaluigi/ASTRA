const G=JSON.parse(document.getElementById('graph').textContent),svg=document.getElementById('view'),grid=document.getElementById('overviewGrid'),workspace=document.getElementById('workspace'),detail=document.getElementById('detail'),search=document.getElementById('search'),list=document.getElementById('documents'),byId=new Map(G.nodes.map(n=>[n.id,n])),docs=G.nodes.filter(n=>n.type==='document').sort((a,b)=>a.label.localeCompare(b.label)),candidateDocs=G.edges.filter(e=>e.type==='candidate_connection'&&byId.get(e.source)?.type==='document');let selected=null;

function updateList(){const q=search.value.toLowerCase();list.replaceChildren();docs.filter(d=>!q||d.label.toLowerCase().includes(q)||d.source_id.toLowerCase().includes(q)).forEach(d=>{const b=el('button',d.label);b.title=d.source_id;b.onclick=()=>selectDocument(d.id);list.appendChild(b)})}
function shortTitle(doc){const title=(doc.metadata_title||doc.label).replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();return title.length>64?title.slice(0,61)+'…':title}
function overview(){selected=null;svg.setAttribute('hidden','');grid.removeAttribute('hidden');workspace.scrollTop=0;document.scrollingElement.scrollTop=0;const q=search.value.toLowerCase(),shown=docs.filter(d=>!q||d.label.toLowerCase().includes(q)||d.source_id.toLowerCase().includes(q));grid.replaceChildren();shown.forEach(doc=>{const linkEdges=candidateDocs.filter(e=>e.source===doc.id||e.target===doc.id),links=linkEdges.map(e=>byId.get(e.source===doc.id?e.target:e.source));const box=el('article',undefined,'doc-card');box.tabIndex=0;box.title=doc.label;box.setAttribute('aria-label',`Open ${doc.label}`);box.append(el('div',shortTitle(doc),'doc-title'),el('div',`${doc.source_id} · ${doc.page_count} pages`,'doc-meta'));if(links.length){const states=linkEdges.map(decisionOf),worst=states.includes('pending')?'pending':states.includes('rejected')?'rejected':'accepted';box.append(el('div',`Candidate ${links.length===1?'link':'links'} (${states.join(', ')}): ${links.map(shortTitle).join('; ')}`,'doc-links '+worst))}box.onclick=()=>selectDocument(doc.id);box.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectDocument(doc.id)}};grid.appendChild(box)});document.getElementById('stats').textContent=`${shown.length} documents · ${candidateDocs.filter(e=>shown.some(n=>n.id===e.source)&&shown.some(n=>n.id===e.target)).length} candidate links`;detail.replaceChildren(el('h2','All documents'),el('p','Cards use short titles; hover for the full filename. Pending candidate links are orange, accepted green, rejected red; pending links are unverified. Open a card for the graph, PDF page links, and exact-page evidence.','muted'))}
function selectDocument(docId){selected=docId;grid.setAttribute('hidden','');grid.replaceChildren();svg.removeAttribute('hidden');workspace.scrollTop=0;document.scrollingElement.scrollTop=0;const doc=byId.get(docId),direct=G.edges.filter(e=>e.source===docId||e.target===docId),ids=new Set([docId]);direct.forEach(e=>{ids.add(e.source);ids.add(e.target)});const draft=direct.find(e=>e.type==='has_draft');if(draft)G.edges.filter(e=>e.source===draft.target&&e.type==='contains_citation').forEach(e=>{ids.add(e.target);G.edges.filter(x=>x.source===e.target&&x.type==='cites_page').forEach(x=>ids.add(x.target))});const candidate=direct.filter(e=>e.type==='candidate_connection');candidate.forEach(e=>(e.evidence||[]).forEach(x=>{const [ld,lp]=x.left.split(' p'),[rd,rp]=x.right.split(' p');ids.add(`page:${ld}:${lp}`);ids.add(`page:${rd}:${rp}`)}));const shown=G.nodes.filter(n=>ids.has(n.id)),visible=new Set(shown.map(n=>n.id)),shownEdges=G.edges.filter(e=>visible.has(e.source)&&visible.has(e.target));draw(shown,shownEdges,true);detail.replaceChildren(el('h2',doc.label),el('p',`${doc.source_id} · ${doc.page_count} pages`,'muted'));const aliases=direct.filter(e=>e.type==='aliases').map(e=>byId.get(e.source).label);if(aliases.length)detail.appendChild(card('Aliases',aliases.join('\n')));if(draft)detail.appendChild(card('Draft',`${byId.get(draft.target).label} · ${byId.get(draft.target).status}`));const citations=draft?G.edges.filter(e=>e.source===draft.target&&e.type==='contains_citation'):[];if(citations.length)detail.appendChild(card('Citations',citations.map(e=>byId.get(e.target).label).join(', ')));candidate.forEach(e=>{const c=candidateText(e,docId),box=el('section',undefined,'card '+decisionOf(e));box.append(el('h3',`${decisionOf(e)==='accepted'?'Accepted':'Unverified'} candidate: ${c.other.label}`),el('div',decisionLabel(e),'muted'));(c.items||[]).forEach(x=>{const row=el('div',undefined,'muted'),la=el('a',x.left),lb=el('a',x.right);la.href=pdfHref(x.left);lb.href=pdfHref(x.r
