</style></head><body><main><h1>Miscdocs cento</h1><p class="muted">Found poems composed from verbatim spans of the exact pages behind each candidate graph link. Every line is cited; clicking a citation opens the PDF at that page (localhost library). Nothing here asserts a real relationship — it is a serendipity view over existing evidence.</p><div id="root"></div></main><script id="centos" type="application/json">[{"id":"edge:1612c8ed2a516fa92e63","doc_a":"M375C7123FE0F","doc_b":"ME3F5EABBEB87","left_label":"Water_The_Cradle_of_Life_via_its_Coheren.pdf","right_label":"1079-2978-1-PB.pdf","pool":[[],[{"doc":"ME3F5EABBEB87","page":13,"text":"Meijer D., Consciousness in the Universe is Scale Invariant and Implies an Event Horizon of the Human Brain...","filename":"1079-2978-1-PB.pdf"},{"doc":"ME3F5EABBEB87","page":13,"text":"Recently, Henry, 2016, derived the characteristic frequencies involving inorganic ions in aqueous solution.","filename":"1079-2978-1-PB.pdf"}]]},{"id":"edge:239aa9b5ded47628322a","doc_a":"M26737B41E7E8","doc_b":"MB0E6AD4DDA03","left_label":"1-s2.0-S0010945223002733-main.pdf","right_label":"Enhanced mind-matter interactions following rTMS induced frontal lobe inhibition - ScienceDirect.pdf","pool":[[{"doc":"M26737B41E7E8","page":1,"text":"We report our \ufb01ndings in healthy participants with rTMS induced reversible brain lesions.","filename":"1-s2.0-S0010945223002733-main.pdf"},{"doc":"M26737B41E7E8","page":2,"text":"Moreover, although theories to explain psi have been proposed ( Radin, 2006), none are considered adequate.","filename":"1-s2.0-S0010945223002733-main.pdf"},{"doc":"M26737B41E7E8","page":2,"text":"However, this has clearly not been the case.","filename":"1-s2.0-S0010945223002733-main.pdf"},{"doc":"MB0E6AD4DDA03","page":3,"text":"These stimuli could create a significant distraction that could have a negative effect on survival.","filename":"Enhanced mind-matter interactions following rTMS induced frontal lobe inhibition - ScienceDirect.pdf"},{"doc":"MB0E6AD4DDA03","page":4,"text":"We report our findings using rTMS in a well- powered study involving healthy participants (n = 108).","filename":"Enhanced mind-matter interactions following rTMS induced frontal lobe inhibition - ScienceDirect.pdf"},{"doc":"M26737B41E7E8","page":2,"text":"Ethical considerations The study received ethics approval by Clinical Trials Ontario (application #1511).","filename":"1-s2.0-S0010945223002733-main.pdf"},{"doc":"M26737B41E7E8","page":2,"text":"The lead REB site is Baycrest Health Sci- ences in Toronto (application #12 e51).","filename":"1-s2.0-S0010945223002733-main.pdf"},{"doc":"M26737B41E7E8","page":2,"text":"Written informed consent was obtained prior to enrolling participants in the study.","filename":"1-s2.0-S0010945223002733-main.pdf"},{"doc":"M26737B41E7E8","page":2,"text":"Participants One hundred and eight healthy participants were recruited from the Rotman Participant Database.","filename":"1-s2.0-S0010945223002733-main.pdf"},{"doc":"M26737B41E7E8","page":3,"text":"Sham rTMS) and right intention effect (intention v.","filename":"1-s2.0-S0010945223002733-main.pdf"},{"doc":"M26737B41E7E8","page":3,"text":"Participants were also evenly allocated to start with either left intention trials or right intention trials.","filename":"1-s2.0-S0010945223002733-main.pdf"},{"doc":"M26737B41E7E8","page":3,"text":"This position was close to C3.","filename":"1-s2.0-S0010945223002733-main.pdf"}],[{"doc":"MB0E6AD4DDA03","page":25,"text":"Future replication studies are encouraged and should utilize a pre-registered framework.","filename":"Enhanced mind-matter interactions following rTMS induced frontal lobe inhibition - ScienceDirect.pdf"},{"doc":"MB0E6AD4DDA03","page":25,"text":"This may help explain why these effects are so small and hard to replicate in healthy participants.","filename":"Enhanced mind-matter interactions following rTMS induced frontal lobe inhibition - ScienceDirect.pdf"},{"doc":"MB0E6AD4DDA03","page":25,"text":"However, the omitted fields will be made available to researchers on request.","filename":"Enhanced mind-matter interactions following rTMS induced frontal lobe inhibition - ScienceDirect.pdf"}]]},{"id":"edge:26fa39e93626fa0cd229","doc_a":"MA01F97589EBD","doc_b":"MD7AF3D1AD9FA","left_label":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf","right_label":"2310.12989v1.pdf","pool":[[{"doc":"MA01F97589EBD","page":3,"text":"handle free-text unstructured input.","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"},{"doc":"MA01F97589EBD","page":3,"text":"All the above FHIR transformation tools necessitate multiple NLP tools in sequence.","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"},{"doc":"MA01F97589EBD","page":3,"text":"We manually annotated a dataset of free-text to FHIR MedicationStatement resource transformation pairs.","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"},{"doc":"MA01F97589EBD","page":3,"text":"is an illustrative visual representation of the work\ufb02ow.","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"},{"doc":"MA01F97589EBD","page":3,"text":"For detailed examples of the elements in MedicationStatement, please refer to Error!","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"},{"doc":"MA01F97589EBD","page":3,"text":"Reference source not found..","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"},{"doc":"MA01F97589EBD","page":3,"text":"The clinical text input was obtained from the 2018 n2c2 medication extraction challenge.","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"},{"doc":"MA01F97589EBD","page":3,"text":"Our human annotation consisted of three key steps.","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"},{"doc":"MA01F97589EBD","page":3,"text":"We started by standardizing the entities from free text into clinical terminology coding systems.","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"},{"doc":"MA01F97589EBD","page":4,"text":"We accessed the GPT-4 (model: gpt-4-32k as of 2023-05-15) through the Azure OpenAI API service.","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"},{"doc":"MA01F97589EBD","page":4,"text":"We made multiple asynchronous API calls to enhance ef\ufb01ciency.","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"},{"doc":"MA01F97589EBD","page":4,"text":"GPTQ was used to accelerate the inference time for Llama-2-70B and Falcon-180B.","filename":"FHIR-GPT Enhances Health Interoperability with Large Language Models _ medRxiv.pdf"}],[{"doc":"MD7AF3D1AD9FA","page":1,"text":"However, it is by no means an easy task.","filename":"2310.12989v1.pdf"},{"doc":"MD7AF3D1AD9FA","page":1,"text":"The free-text input was derived from the discharge summaries of the MIMIC- III datase.","filename":"2310.12989v1.pdf"},{"doc":"MD7AF3D1AD9FA","page":1,"text":"We organized the contexts and codes into FHIR medicationStatement resources.","filename":"2310.12989v1.pdf"},{"doc":"MD7AF3D1AD9FA","page":1,"text":"Large Language Model We used OpenAI's GPT-4 model as the LLM for FHIR format transformation.","filename":"2310.12989v1.pdf"},{"doc":"MD7AF3D1AD9FA","page":1,"text":"Then, we manually reviewed the discrepancies between the LLM-generated FHIR output and our human annotations.","filename":"2310.12989v1.pdf"},{"doc":"MD7AF3D1AD9FA","page":1,"text":"Common mistakes were identified and used to refine the prompts.","filename":"2310.12989v1.pdf"},{"doc":"MD7AF3D1AD9FA","page":1,"text":"Additionally, even if we had such comprehensive lists, they would have exceeded the token limits for LLMs.","filename":"2310.12989v1.pdf"},{"doc":"MD7AF3D1AD9FA","page":1,"text":"drug routes and forms, numbering in the hundreds, we allowed LLMs to directly code them.","filename":"2310.12989v1.pdf"},{"doc":"MD7AF3D1AD9FA","page":1,"text":"Additionally, we reported precision, recall, and F1 scores for specific element occurrences.","filename":"2310.12989v1.pdf"},{"doc":"MD7AF3D1AD9FA","page":1,"text":"Each text input was individually transformed into a MedicationStatement resource.","filename":"2310.12989v1.pdf"},{"doc":"MD7AF3D1AD9FA","page":1,"text":"To optimize efficiency, we made multiple asynchronous API calls.","filename":"2310.12989v1.pdf"},{"doc":"MD7AF3D1AD9FA","page":1,"text":"*Co-first Authors; \u2020 Co-Senior Authors; This study was conducted partially during Y.","filename":"2310.12989v1.pdf"}]]},{"id":"edge:f14f7fdcaa90ed9e9e4d","doc_a":"M9BFE474D9278","doc_b":"ME99E8FF3E83C","left_label":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf","right_label":"Exploring Rulial Space - Turing Machines in Wolfram Physics.pdf","pool":[[{"doc":"M9BFE474D9278","page":6,"text":"must inevitably perceive the universe to follow the laws of general relativity.","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"},{"doc":"M9BFE474D9278","page":6,"text":"The Quantum Observer OK, so what about quantum mechanics?","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"},{"doc":"M9BFE474D9278","page":6,"text":"How does that relate to observers?","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"},{"doc":"M9BFE474D9278","page":6,"text":"But the essence of quantum mechanics is that actually there are many threads of history that are followed.","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"},{"doc":"M9BFE474D9278","page":6,"text":"And an important feature of our models is that this is inevitable.","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"},{"doc":"M9BFE474D9278","page":6,"text":"The underlying rules define how local patterns of connections between atoms of space should be updated.","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"},{"doc":"M9BFE474D9278","page":6,"text":"So how will an observer perceive all this?","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"},{"doc":"M9BFE474D9278","page":6,"text":"The crucial point is that the observer is themselves part of this multiway system.","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"},{"doc":"M9BFE474D9278","page":6,"text":"So in other words, if the universe is branching, so is the observer.","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"},{"doc":"M9BFE474D9278","page":6,"text":"And in essence the question becomes how a \u201cbranching brain\u201d will perceive a branching universe.","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"},{"doc":"M9BFE474D9278","page":6,"text":"Well, it seems like very much the same kind of thing is going on with observers in quantum mechanics.","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"},{"doc":"M9BFE474D9278","page":6,"text":"It\u2019s just that instead of being extended in physical space, they\u2019re extended in what we call branchial space.","filename":"What is Consciousness - New Perspectives from Physics - Wolfram.pdf"}],[{"doc":"ME99E8FF3E83C","page":33,"text":"It\u2019s fairly easy to see this for two steps of s = 2, k = 2 Turing machines.","filename":"Exploring Rulial Space - Turing Machines in Wolfram Physics.pdf"}]]}]</script><script>

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
